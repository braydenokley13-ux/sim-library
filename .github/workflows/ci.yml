name: registry
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - name: Validate the registry
        run: npm run validate
      - name: Registry integrity tests
        run: npm test
      - name: Public payload carries nothing internal
        run: npm run build:public
      - name: Generated files are in sync with the data
        # Every generated artefact is checked in so it can be reviewed in a pull
        # request. That only helps if it is actually current, so the build is run
        # and the working tree must come back clean.
        run: |
          npm run build
          npm run build:public
          npm run queue
          if ! git diff --quiet -- CATALOG.md app/index.html public docs/work-queue.md; then
            echo "::error::A generated file is stale. Run 'npm run check' and commit the result."
            git --no-pager diff --stat -- CATALOG.md app/index.html public docs/work-queue.md
            exit 1
          fi
